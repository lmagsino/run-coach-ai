# Render blueprint: one free web service built from the Dockerfile (ADR 0007).
# Secrets are set in the dashboard, never here. Pair it with a Neon free
# Postgres and put its connection string in DATABASE_URL.
services:
  - type: web
    name: runcoach
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-opus-5-5
      - key: ANTHROPIC_EFFORT
        value: medium
      - key: RUNCOACH_OWNER_EMAIL
        sync: false
      # Your sign-in password, typed here; it is hashed on first start and can be
      # changed on the account page afterwards.
      - key: RUNCOACH_OWNER_PASSWORD
        sync: false
      # Leave unset to keep sign-up closed; set it to invite other runners.
      - key: RUNCOACH_INVITE_CODE
        sync: false
      - key: RUNCOACH_MEMBER_CAP
        value: "10"
      - key: RUNCOACH_GLOBAL_DAILY_CAP
        value: "100"
      # Render makes this once. Keep it: a new key cannot open stored Garmin tokens.
      - key: RUNCOACH_TOKEN_KEY
        generateValue: true
      - key: GARMIN_MCP_COMMAND
        value: garmin-mcp
      # Optional: the one-line bundle from deploy/garmin-mcp/bundle.sh, so the
      # host is connected on start without a paste. Rotate it when it expires.
      - key: RUNCOACH_GARMIN_BUNDLE
        sync: false
