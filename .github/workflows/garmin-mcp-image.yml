name: garmin-mcp image

# Publishes deploy/garmin-mcp as ghcr.io/<owner>/garmin-mcp so a runner who
# never cloned this repo can make their Garmin token bundle with one docker
# command (the Account page shows it). The tag is the pinned upstream commit,
# plus latest.
on:
  push:
    branches: [main]
    paths: ["deploy/garmin-mcp/Dockerfile", ".github/workflows/garmin-mcp-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned upstream commit
        id: pin
        run: |
          ref=$(sed -n 's/^ARG GARMIN_MCP_REF=//p' deploy/garmin-mcp/Dockerfile)
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "short=${ref:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Multi-arch, so the command works on Apple silicon as well as Intel.
      - uses: docker/build-push-action@v6
        with:
          context: deploy/garmin-mcp
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GARMIN_MCP_REF=${{ steps.pin.outputs.ref }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Upstream Taxuspt/garmin_mcp at ${{ steps.pin.outputs.short }}, for making a RunCoach token bundle
          tags: |
            ghcr.io/${{ github.repository_owner }}/garmin-mcp:${{ steps.pin.outputs.short }}
            ghcr.io/${{ github.repository_owner }}/garmin-mcp:latest
